[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "war-room"
version = "0.1.0"
description = "IT Incident Response War-Room Multi-Agent System"
authors = [{ name = "Senior Engineer" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agent-framework-core>=1.23.0",
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
